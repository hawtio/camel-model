version: 2
updates:
  - package-ecosystem: maven
    directory: '/'
    schedule:
      interval: monthly
  - package-ecosystem: maven
    directory: '/'
    schedule:
      interval: monthly
    target-branch: '4.14.x'
  - package-ecosystem: maven
    directory: '/'
    schedule:
      interval: monthly
    target-branch: '4.10.x'
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
